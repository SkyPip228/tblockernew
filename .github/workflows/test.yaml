name: Test

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          files="$(gofmt -l .)"
          echo "$files"
          test -z "$files"

      - name: Run non-privileged unit tests
        run: go test ./config ./storage ./utils -count=1

      - name: Compile all test packages
        run: go test ./... -run=NO_TESTS_SHOULD_MATCH

      - name: Check installer syntax
        run: bash -n install.sh

      - name: Build
        run: go build ./...
